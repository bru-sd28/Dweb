<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Atividade 9</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .secao {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <h1>Exercicios de JavaScript</h1>

    <div class="secao">
        <h3>1) Encontrar o Maior Número</h3>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <input type="number" id="num3" placeholder="Número 3">
        <br>
        <button onclick="testarMaior()">Testar</button>
    </div>

    <div class="secao">
        <h3>2) Ordenar em Ordem Crescente</h3>
        <input type="number" id="ord1" placeholder="Número 1">
        <input type="number" id="ord2" placeholder="Número 2">
        <input type="number" id="ord3" placeholder="Número 3">
        <br>
        <button onclick="testarOrdem()">Testar</button>
    </div>

    <div class="secao">
        <h3>3) Verificar Palíndromo</h3>
        <input type="text" id="palavraPalindromo" placeholder="Digite uma palavra ou frase">
        <br>
        <button onclick="testarPalindromo()">Testar</button>
    </div>

    <div class="secao">
        <h3>4) Verificar Subconjunto</h3>
        <input type="text" id="palavra1" placeholder="Palavra principal">
        <input type="text" id="palavra2" placeholder="Palavra secundária">
        <br>
        <button onclick="testarSubconjunto()">Testar</button>
    </div>

    <div class="secao">
        <h3>5) Dia da Semana</h3>
        <input type="date" id="dataInput">
        <br>
        <button onclick="testarDia()">Testar</button>
    </div>

    <script src="script.js"></script>
    <script>
        function testarMaior() {
            let n1 = parseFloat(document.getElementById("num1").value);
            let n2 = parseFloat(document.getElementById("num2").value);
            let n3 = parseFloat(document.getElementById("num3").value);
            
            let resultado = encontrarMaior(n1, n2, n3);
            alert("O maior número é: " + resultado);
        }

        function testarOrdem() {
            let n1 = parseFloat(document.getElementById("ord1").value);
            let n2 = parseFloat(document.getElementById("ord2").value);
            let n3 = parseFloat(document.getElementById("ord3").value);
            
            let resultado = ordenarCrescente(n1, n2, n3);
            alert("Em ordem crescente: " + resultado);
        }

        function testarPalindromo() {
            let texto = document.getElementById("palavraPalindromo").value;
            let resultado = verificarPalindromo(texto);
            alert("O texto " + resultado);
        }

        function testarSubconjunto() {
            let p1 = document.getElementById("palavra1").value;
            let p2 = document.getElementById("palavra2").value;
            
            let resultado = verificarSubconjunto(p1, p2);
            alert("Resultado: " + resultado);
        }

        function testarDia() {
            let dataStr = document.getElementById("dataInput").value;
            let resultado = obterDiaDaSemana(dataStr);
            alert("O dia da semana é: " + resultado);
        }
    </script>

</body>
</html>
